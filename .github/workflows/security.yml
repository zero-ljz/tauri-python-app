name: security

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "requirements*.txt"
      - "backend/requirements.txt"
      - "src-tauri/Cargo.lock"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          pnpm install --frozen-lockfile
      - name: Audit JavaScript production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Audit Python runtime dependencies
        run: python -m pip_audit -r backend/requirements.txt
      - name: Generate Python CycloneDX SBOM
        run: python -m pip_audit -r backend/requirements.txt --format cyclonedx-json --output sbom-python.json
      - uses: actions/upload-artifact@v7
        with:
          name: python-sbom
          path: sbom-python.json

  rust-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          working-directory: src-tauri
          token: ${{ secrets.GITHUB_TOKEN }}
