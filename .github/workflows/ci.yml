name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          pnpm install --frozen-lockfile

      - name: Build native Python sidecar
        run: pnpm build:backend

      - name: Run quality gate
        run: pnpm check

      - name: Execute native Python sidecar smoke test
        run: python scripts/smoke_sidecar.py

      - name: Verify complete Tauri integration build
        run: pnpm tauri build --debug --no-bundle
